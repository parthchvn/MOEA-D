name: Tests and smoke reproduction
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-evidence.txt
      - run: python -m pip install -r requirements-evidence.txt
      - run: python -m pip install -e . --no-deps
      - name: Mathematical, transition, oracle, and regression tests
        run: python -m pytest -q
      - name: Run seeded smoke protocol
        run: python -m moead.experiments --config experiments/smoke.json --out results-local/smoke --engine numba
      - name: Render smoke report
        run: python -m moead.report --input results-local/smoke
      - name: Verify freshly generated smoke evidence
        run: python -m moead.verify --input results-local/smoke --check-source
      - name: Verify committed evidence and generating source hashes
        run: python -m moead.verify --input evidence/neighborhoods --check-source
