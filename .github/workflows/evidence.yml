name: Reproduce and commit neighborhood evidence
on:
  push:
    branches: ['research/reproducible-neighborhoods-20261102']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'experiments/**'
      - 'requirements-evidence.txt'
      - 'pyproject.toml'
      - '.github/workflows/evidence.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: neighborhood-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reproduce:
    # Reproduction commits are confined to a research branch, never main.
    if: startsWith(github.ref, 'refs/heads/research/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-evidence.txt
      - run: python -m pip install -r requirements-evidence.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest -q
      - run: python -m moead.experiments --config experiments/neighborhoods.json --out evidence/neighborhoods --engine numba --overwrite
      - run: python -m moead.report --input evidence/neighborhoods
      - run: python -m moead.verify --input evidence/neighborhoods --check-source
      - name: Commit generated artifacts only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MOEA/D evidence workflow'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/neighborhoods
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate seeded neighborhood evidence [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
