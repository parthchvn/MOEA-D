[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moead-oneminmax"
version = "0.1.0"
description = "Reproducible OneMinMax experiments for explicitly specified MOEA/D variants"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]

[project.optional-dependencies]
fast = ["numba>=0.60"]
test = ["pytest>=8"]

[project.scripts]
moead-experiments = "moead.experiments:main"
moead-report = "moead.report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
